# Nginx para SolarFix (VPS). Copiar a /etc/nginx/sites-available/solarfix y cambiar:
#   - server_name: tu dominio
#   - root: la carpeta public de la app
#   - fastcgi_pass: el socket de tu versión de PHP
# Después: ln -s /etc/nginx/sites-available/solarfix /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# El HTTPS lo agrega certbot (ver docs/PUBLICACION.md).

server {
    listen 80;
    listen [::]:80;
    server_name taller.midominio.com;
    root /var/www/solarfix/public;
    index index.php;

    charset utf-8;
    # Fotos de órdenes desde el celular (la app las reduce después de subirlas).
    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos compilados (CSS/JS con nombre versionado): caché larga.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Nada más se ejecuta ni se sirve fuera de public/ (.env, storage, etc.).
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
