<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión · SolarFix</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f4f6; font-family: system-ui, sans-serif; color: #1f2937; }
        main { text-align: center; padding: 24px; max-width: 320px; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { color: #6b7280; font-size: 15px; line-height: 1.5; }
        button { margin-top: 16px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 15px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="SolarFix">
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. Revisa la conexión del celular y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
